[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdmirror"
version = "0.1.0"
description = "Keep a local mirror of HistData.com ASCII tick archives, with Parquet copies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Nicolas SG" }]
dependencies = [
    "polars>=1.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
hdmirror = "hdmirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
